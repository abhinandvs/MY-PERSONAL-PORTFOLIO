<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memories | Abhinand V S</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css"> <!-- Base styles -->
    <link rel="stylesheet" href="memories.css"> <!-- Specific styles -->
</head>

<body>

    <!-- Floating Header -->
    <div class="memories-header reveal-up">
        <span class="header-label">Dokumentasi</span>
        <div class="pill-nav">
            <a href="#" class="pill active">Galeri</a>
            <a href="#" class="pill">Album</a>
            <a href="#" class="pill">Camera</a>
        </div>
        <div class="item-count">
            <span>3504</span>
            <small>Item</small>
        </div>
    </div>

    <!-- Masonry Grid -->
    <main class="gallery-container">
        <div class="masonry-grid">
            <!-- Col 1 -->
            <div class="masonry-col">
                <div class="photo-card reveal-up delay-1">
                    <img src="assets/memory1.jpg" alt="Memory"
                        onerror="this.src='https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?ixlib=rb-1.2.1&auto=format&fit=crop&w=1000&q=80'">
                </div>
                <div class="photo-card reveal-up delay-3">
                    <img src="assets/memory2.jpg" alt="Memory"
                        onerror="this.src='https://images.unsplash.com/photo-1516035069371-29a1b244cc32?ixlib=rb-1.2.1&auto=format&fit=crop&w=1000&q=80'">
                </div>
            </div>

            <!-- Col 2 -->
            <div class="masonry-col">
                <div class="photo-card reveal-up delay-2">
                    <img src="assets/memory3.jpg" alt="Memory"
                        onerror="this.src='https://images.unsplash.com/photo-1506744038136-46273834b3fb?ixlib=rb-1.2.1&auto=format&fit=crop&w=1000&q=80'">
                </div>
                <div class="photo-card reveal-up delay-4 large">
                    <img src="assets/memory4.jpg" alt="Memory"
                        onerror="this.src='https://images.unsplash.com/photo-1554080353-a576cf803bda?ixlib=rb-1.2.1&auto=format&fit=crop&w=1000&q=80'">
                </div>
            </div>

            <!-- Col 3 -->
            <div class="masonry-col">
                <div class="photo-card reveal-up delay-1">
                    <img src="assets/memory5.jpg" alt="Memory"
                        onerror="this.src='https://images.unsplash.com/photo-1500917293891-ef795e70e1f6?ixlib=rb-1.2.1&auto=format&fit=crop&w=1000&q=80'">
                </div>
                <div class="photo-card reveal-up delay-3">
                    <img src="assets/memory6.jpg" alt="Memory"
                        onerror="this.src='https://images.unsplash.com/photo-1472214103451-9374bd1c798e?ixlib=rb-1.2.1&auto=format&fit=crop&w=1000&q=80'">
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Section -->
    <footer class="memories-footer reveal-up">
        <div class="footer-content-wrapper">
            <div class="footer-top">
                <div class="archive-label">Archives</div>
                <h1>Memory.</h1>
                <p class="date-range">Januari - Desember 2026</p>
            </div>

            <div class="footer-actions">
                <a href="index.html" class="visit-btn">
                    <i class="fas fa-arrow-left"></i>
                    <span>Visit site</span>
                </a>

                <div class="circle-btn">
                    <i class="fas fa-search"></i>
                </div>
                <div class="circle-btn" style="border-radius: 20px; width: auto; padding: 0 20px; aspect-ratio: auto;">
                    <span>01/365</span>
                    <i class="fas fa-external-link-alt" style="margin-left: 10px;"></i>
                </div>
            </div>

            <div class="quote-block">
                <p>"Sebuah foto bisa akan sangat berharga bukan hanya dari gaya, fokos & warnanya saja, tapi juga
                    kenangannya."</p>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="animations.js"></script>
    <script src="spotlight.js"></script>
</body>

</html>
