<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloads | Abhinand V S</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="subpages.css">
    <style>
        .download-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px 100px;
            position: relative;
            z-index: 2;
        }
        
        .download-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            transition: all 0.4s ease;
            box-shadow: 0 10px 30px rgba(140, 47, 57, 0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .download-card:hover {
            transform: translateY(-12px);
            border-color: var(--theme-yellow);
            box-shadow: 0 20px 50px rgba(140, 47, 57, 0.12);
            background: rgba(255, 255, 255, 0.7);
        }

        .download-icon {
            font-size: 4rem;
            background: linear-gradient(45deg, var(--theme-pink), var(--theme-yellow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .download-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--theme-cordovan);
            margin: 0;
        }

        .download-desc {
            color: rgba(93, 31, 38, 0.8);
            font-size: 1.1rem;
            max-width: 500px;
            line-height: 1.6;
            margin: 0;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--theme-cordovan), var(--theme-pink));
            color: #fff;
            padding: 15px 35px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(140, 47, 57, 0.3);
            margin-top: 15px;
        }

        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(140, 47, 57, 0.4);
        }
    </style>
</head>

<body>
    <!-- Background Decorations -->
    <div class="bg-decorations">
        <div class="bg-shape shape-1"></div>
        <div class="bg-shape shape-2"></div>
        <div class="bg-shape shape-3"></div>
    </div>
    
    <!-- Navigation Back Button -->
    <nav class="back-nav">
        <a href="index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
    </nav>

    <!-- Page Header -->
    <header class="page-header">
        <h1 class="page-title">Downloads</h1>
        <p class="page-subtitle">Access my professional documents and resources.</p>
    </header>

    <!-- Download Content -->
    <section class="download-container">
        <div class="download-card">
            <i class="fas fa-file-pdf download-icon"></i>
            <h2 class="download-title">Curriculum Vitae</h2>
            <p class="download-desc">Download my latest resume to learn more about my skills, experience, and educational background.</p>
            <a href="#" class="download-btn" download>
                <i class="fas fa-download"></i> Download Resume
            </a>
        </div>
    </section>

</body>

</html>
